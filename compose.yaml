# Local development services. Production infrastructure is configured separately.
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit_data:/data

  # Development-only S3 emulator. Production uses Hetzner Object Storage.
  object-storage:
    image: localstack/localstack:s3-community-archive@sha256:b14111811a1071ff8e05ea2d89fac68dc3aa115bcb0b053f5502a1dfffba4ff8
    restart: unless-stopped
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
      AWS_DEFAULT_REGION: ${CATALOG_STORAGE_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CATALOG_STORAGE_S3_BUCKET: ${CATALOG_STORAGE_S3_BUCKET:-solar-catalog}
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      SKIP_SSL_CERT_DOWNLOAD: "1"
    ports:
      - "127.0.0.1:${LOCALSTACK_GATEWAY_PORT:-4566}:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  mailpit_data:
  localstack_data:
